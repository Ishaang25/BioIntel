# ---------------------------------------------------------------------------
# Render blueprint — BioIntel API.
#
#   1. Push this file to the repository.
#   2. Render dashboard → New → Blueprint → select the repo.
#   3. Fill in the values marked `sync: false` when prompted.
#
# Deploys the API only. The frontend is a Next.js SSR app and is happier on
# Vercel; point its BIOINTEL_API_URL at this service's URL once it is live.
#
# The database is deliberately not declared here. Render's own free Postgres
# expires, so `DATABASE_URL` is left as a prompted value — paste a connection
# string from a provider whose free tier persists (Neon, Supabase). Any
# `postgres://` or `postgresql://` URL is accepted; the application rewrites
# the scheme onto the psycopg 3 driver it ships (see core/config.py).
# ---------------------------------------------------------------------------

services:
  - type: web
    name: biointel-api
    runtime: docker
    repo: https://github.com/Ishaang25/BioIntel.git
    branch: perf/chunked-entity-extraction
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/v1/ready

    envVars:
      # --- required --------------------------------------------------------
      - key: ENVIRONMENT
        value: production

      # Startup aborts without these two; see the validator in core/config.py.
      # `generateValue` has Render mint a strong secret and keep it.
      - key: API_KEYS
        generateValue: true
      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        sync: false

      # The frontend's origin, e.g. https://biointel.vercel.app.
      #
      # Required, not cosmetic: a Vercel Serverless Function may receive at
      # most 4.5 MB of request body on any plan, so a deck above that cannot
      # reach this API through the frontend's proxy. The browser posts those
      # straight here instead (see app/core/upload_tickets.py), which is a
      # cross-origin request. If this does not list the frontend's origin,
      # every upload over ~4 MB fails with an opaque browser network error.
      - key: CORS_ORIGINS
        sync: false

      # Without a key the pipeline falls back to its deterministic offline
      # analyser and every report is marked degraded. It still runs.
      - key: OPENAI_API_KEY
        sync: false

      # --- deployment shape ------------------------------------------------
      # One service, no worker: analyses run in a background thread of the API
      # process and the request returns immediately. Switching this to `worker`
      # requires a second service running `biointel-worker`.
      - key: JOB_EXECUTION_MODE
        value: inline

      # The free plan has no persistent disk, so /data does not survive a
      # restart. Reports are unaffected — they are read from the database — but
      # the uploaded PDF and its page renders are lost, so re-analysing an older
      # document will fail. Attach a disk on a paid instance to fix that.
      - key: STORAGE_DIR
        value: /data

      # Nothing else runs migrations in a deployed environment: main.py only
      # calls create_all() when ENVIRONMENT is local or test, and the free plan
      # has no pre-deploy hook. The entrypoint applies them on boot instead.
      - key: RUN_MIGRATIONS
        value: "true"

      # --- concurrency -----------------------------------------------------
      # These were lowered to 4 and 2 to avoid OOM on a 512 MB instance. That
      # treated the symptom: page understanding gathered every page at once and
      # each coroutine read its render before its first await, so one decoded
      # PNG per page of the deck was resident no matter what this was set to.
      # Admission is now bounded at the gather (see PageUnderstandingStage), so
      # the resident set is `concurrency` images rather than the whole deck, and
      # the default is safe again. Every parallel stage -- page understanding,
      # entities, claims, assessment -- scales with this.
      - key: LLM_CONCURRENCY
        value: "12"
      - key: RETRIEVAL_CONCURRENCY
        value: "4"

      # --- observability ---------------------------------------------------
      - key: LOG_JSON
        value: "true"
      - key: LOG_LEVEL
        value: INFO

      # --- optional: raises third-party rate limits ------------------------
      # NCBI: 3 → 10 requests/second. Free from ncbi.nlm.nih.gov/account.
      - key: NCBI_API_KEY
        sync: false
      # Sent in the User-Agent; NCBI requires a contact address for E-utilities.
      - key: NCBI_TOOL_EMAIL
        sync: false
